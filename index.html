n:center;color:var(--muted)}.toolbar{display:flex;align-items:center;gap:8px}.toolbar .label{font-weight:650;min-width:160px;text-align:center}.week-grid{overflow:auto;display:grid;grid-template-columns:72px repeat(var(--days,5),minmax(120px,1fr));border:1px solid var(--line);border-radius:16px;background:var(--card)}.week-grid .wh,.week-grid .cell{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px;min-height:100px}.week-grid .wh{min-height:52px;background:#f7f6f0;position:sticky;top:0;z-index:1;font-size:12px;color:var(--muted)}.week-grid .wh:first-child{left:0;z-index:2}.hour-label{font-size:12px;color:var(--muted);position:sticky;left:0;background:var(--card);z-index:1}.cell{cursor:pointer;min-width:120px}.cell:hover{background:#f7f8f3}.lesson{height:100%;min-height:82px;border-radius:12px;padding:9px;background:var(--mint);border-left:3px solid var(--accent);font-size:12px}.lesson b{display:block;font-size:13px;margin-bottom:5px}.lesson .topic{display:block;color:#52665a;line-height:1.3}.lesson .icons{margin-top:6px}.cell.empty-slot{background:#fffefa}.day-pills{display:none;gap:7px;overflow:auto;margin-bottom:14px}.daypick{white-space:nowrap;flex:0 0 auto;background:var(--card);font-size:13px}.daypick.active{background:var(--ink);color:#fff}.classcard{position:relative;overflow:hidden}.classcard:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--class,#527e69)}.progress{height:7px;background:#e8e9e2;border-radius:10px;overflow:hidden;margin:10px 0}.progress i{display:block;height:100%;background:var(--class,#527e69);border-radius:10px}.formrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:6px;margin:0 0 13px}.field label{font-size:12px;font-weight:650;color:#56665d}.field input,.field select,.field textarea,input.search{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 12px;min-height:46px;color:inherit;width:100%;font-size:16px}.field textarea{min-height:96px;resize:vertical}.checkline{display:flex;align-items:center;gap:10px;min-height:44px}.checkline input{width:20px;height:20px;accent-color:var(--ink)}.modalwrap{position:fixed;inset:0;z-index:20;background:#14251f88;display:grid;place-items:center;padding:20px}.modal{width:min(650px,100%);max-height:90dvh;overflow:auto;background:var(--card);border-radius:22px;padding:24px;box-shadow:0 30px 90px #0004}.modalhead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}.modalhead h2{font:26px Georgia,serif;margin:0}.close{border:0;background:#f0f1eb;border-radius:50%;width:42px;height:42px;font-size:20px}.modalfoot{display:flex;justify-content:space-between;gap:9px;margin-top:18px}.modalfoot .right{display:flex;gap:8px}.listrow{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding:12px 0}.listrow:last-child{border:0}.listrow .grow{flex:1;min-width:0}.listrow small{display:block;color:var(--muted);margin-top:3px}.theme-row{display:grid;grid-template-columns:1fr 75px 90px auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.backup-card{border:2px solid #9eb7a4;background:linear-gradient(135deg,var(--card),var(--mint))}.file-input-proxy{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.dangerzone{border:1px solid #efd5ca;background:#fff9f6}.event-date{min-width:75px;font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}.search{margin-bottom:14px}.footer-note{font-size:12px;color:var(--muted);line-height:1.5}.mobile-nav{display:none}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);z-index:30;background:var(--ink);color:white;padding:12px 18px;border-radius:14px;box-shadow:var(--shadow)}

</style></head><body><div id="app"></div>
<script>
(()=>{'use strict';
const KEY='lehrerplaner.v1', DAYS=['Mo','Di','Mi','Do','Fr','Sa'], DAYFULL=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'], COLORS=['#58856c','#bd714f','#7889ad','#bd9a4f','#927ba6','#4e9993'];
const initial=()=>({version:1,settings:{hours:6,days:5,startTime:'08:00',lessonMinutes:45,breakMinutes:5,weekStart:new Date().toISOString().slice(0,10),weekStartType:'A',schoolYear:'2026/27'},classes:[],template:{},templateB:{},weekTypes:{},weeks:{},todos:[],themes:[]});
let data=load(), view='today',weekShift=0,selectedDay=Math.max(0,(new Date().getDay()+6)%7),editingClass=null,toastTimer;
function load(){try{let d=Object.assign(initial(),JSON.parse(localStorage.getItem(KEY)||'{}'));d.settings=Object.assign(initial().settings,d.settings||{});d.template=d.template||{};d.templateB=d.templateB||{};d.weekTypes=d.weekTypes||{};d.weeks=d.weeks||{};return d}catch(e){return initial()}}
function save(){localStorage.setItem(KEY,JSON.stringify(data));}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{let d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
function dateISO(d){return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
function monday(d){let x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));x.setHours(0,0,0,0);return x}
function currentWeek(){let x=monday(today());x.setDate(x.getDate()+weekShift*7);return x}
function plusDays(d,n){let x=new Date(d);x.setDate(x.getDate()+n);return x}
function fmt(d,opt={weekday:'short',day:'numeric',month:'short'}){return new Intl.DateTimeFormat('de-DE',opt).format(d)}
function isoWeek(d){let x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));x.setUTCDate(x.getUTCDate()+4-(x.getUTCDay()||7));let y=new Date(Date.UTC(x.getUTCFullYear(),0,1));return Math.ceil((((x-y)/86400000)+1)/7)}
function getClass(id){return data.classes.find(c=>c.id===id)}function weekKey(d){return dateISO(monday(d))}function slotKey(day,h){return day+'-'+h}
function weekType(d){let key=weekKey(d);if(data.weekTypes[key]==='A'||data.weekTypes[key]==='B')return data.weekTypes[key];let anchor=monday(new Date((data.settings.weekStart||dateISO(today()))+'T12:00:00')),target=monday(d),days=Math.round((Date.UTC(target.getFullYear(),target.getMonth(),target.getDate())-Date.UTC(anchor.getFullYear(),anchor.getMonth(),anchor.getDate()))/86400000),offset=Math.floor(days/7);return ((offset+(data.settings.weekStartType==='B'?1:0))%2+2)%2===0?'A':'B'}
function setWeekType(date,type){let key=weekKey(new Date(date+'T12:00:00'));data.weekTypes[key]=type;save();render()}function baseSlot(day,h,type=weekType(currentWeek())){let template=type==='B'?data.templateB:data.template;return template[slotKey(day,h)]||{}}
function occurrence(date,h){return data.weeks[date]?.[h]||{}}
function timeAt(h){let [hh,mm]=data.settings.startTime.split(':').map(Number),mins=hh*60+mm+h*(data.settings.lessonMinutes+data.settings.breakMinutes);return `${String(Math.floor(mins/60)%24).padStart(2,'0')}:${String(mins%60).padStart(2,'0')}`}
function endAt(h){let [hh,mm]=timeAt(h).split(':').map(Number),n=hh*60+mm+data.settings.lessonMinutes;return `${String(Math.floor(n/60)%24).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`}
function flash(msg){let old=document.querySelector('.toast');if(old)old.remove();let el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.append(el);setTimeout(()=>el.remove(),2300)}
function nav(){let tabs=[['today','◷','Heute'],['week','▦','Woche'],['classes','▤','Klassen'],['events','◷','Termine'],['settings','⚙','Einstellungen']];return tabs.map(([id,ic,n])=>`<button class="tab ${view===id?'active':''}" data-view="${id}"><span class="ico">${ic}</span>${n}</button>`).join('')}
function shell(){return `<div class="shell"><header class="topbar"><div class="brand"><div class="brandmark">L</div><div><strong>Lehrerplaner</strong><small>Unterricht mit Überblick</small></div></div><div class="top-actions"><button class="iconbtn desk" title="Suche" data-action="search">⌕</button><button class="iconbtn" title="Daten exportieren" data-action="export">↥</button></div></header><div class="layout"><nav class="sidebar">${nav()}</nav><main class="content" id="view"></main></div></div><nav class="mobile-nav">${nav()}</nav>`}
function title(eyebrow,h1,sub='',right=''){return `<div class="headrow"><div><div class="eyebrow">${eyebrow}</div><h1>${h1}</h1>${sub?`<p>${sub}</p>`:''}</div>${right}</div>`}
function viewTitleDate(d){return fmt(d,{day:'numeric',month:'long',year:'numeric'})}
function todayView(){let d=today(),iso=dateISO(d),day=(d.getDay()+6)%7,lessons=[];if(day<data.settings.days)for(let h=0;h<data.settings.hours;h++){let base=baseSlot(day,h,weekType(d)),occ=occurrence(iso,h),cls=getClass(occ.classId??base.classId);if(cls&&occ.type!=='Entfall')lessons.push({h,cls,occ,base})}
let todos=data.todos.filter(t=>!t.done).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')).slice(0,5);let upcoming=allEvents().filter(e=>e.date>=iso&&e.date<=dateISO(plusDays(d,14))).slice(0,5);
return `${title('Dein Überblick',`Guten ${greeting()}`,viewTitleDate(d))}<div class="grid two"><div class="grid"><section class="card hero"><div><div class="eyebrow">${lessons.length?`${lessons.length} Unterrichtsstunden heute`:'Dein Tag, ganz in Ruhe'}</div><div class="date-large">${fmt(d,{weekday:'long'})}</div><div class="hero-meta">${viewDateShort(d)} · KW ${isoWeek(d)} · ${weekType(d)}-Woche <button class="btn small soft" data-weektoggle="${iso}" aria-label="Wochenrhythmus umschalten">Wechseln</button></div></div></section><section class="card"><div class="section-title"><h2>Heute im Unterricht</h2><button class="btn small soft" data-view="week">Wochenplan →</button></div>${lessons.length?lessons.map(x=>lessonRow(x.h,x.cls,x.occ,x.base,d)).join(''):`<div class="empty">Keine eingetragenen Stunden für heute. Ein guter Moment zum Durchatmen. 🌿</div>`}</section></div><div class="grid"><section class="card"><div class="section-title"><h2>Offene To-dos</h2><button class="btn small" data-view="events">Alle →</button></div>${todos.length?todos.map(t=>`<div class="item"><span class="dot" style="background:${t.done?'#8a9':'#cc694c'}"></span><div class="itembody"><b>${esc(t.title)}</b><small>${t.due?dateDisplay(t.due):'Ohne Fälligkeit'}${t.classId&&getClass(t.classId)?' · '+esc(getClass(t.classId).name):''}</small></div><button class="iconbtn" data-todo="${t.id}" title="Erledigt">✓</button></div>`).join(''):`<div class="empty">Keine offenen Aufgaben. Alles im grünen Bereich.</div>`}</section><section class="card"><div class="section-title"><h2>Die nächsten 14 Tage</h2><button class="btn small" data-view="events">Termine →</button></div>${upcoming.length?upcoming.map(eventRow).join(''):`<div class="empty">Keine Tests oder Abgaben geplant.</div>`}</section></div></div>`}
function greeting(){let h=new Date().getHours();return h<11?'Morgen':h<18?'Tag':'Abend'}function viewDateShort(d){return fmt(d,{day:'numeric',month:'long',year:'numeric'})}function dateDisplay(s){if(!s)return '';return fmt(new Date(s+'T12:00:00'),{day:'numeric',month:'short'})}
function lessonRow(h,cls,occ,base,d){let topic=themeForLesson(occ);return `<div class="item"><span class="time">${timeAt(h)}</span><span class="dot" style="background:${esc(cls.color)}"></span><div class="itembody"><b>${esc(cls.name)} · ${esc(cls.subject||'')}</b><small>${esc(topic?.title||occ.planned||'Thema noch offen')}${occ.notes?` · ${esc(occ.notes)}`:''}</small></div><button class="iconbtn" data-lesson="${dateISO(d)}|${h}" aria-label="Stunde bearbeiten">›</button></div>`}
function weekView(){let start=currentWeek(),days=data.settings.days,chosen=Math.min(selectedDay,days-1),dates=Array.from({length:days},(_,i)=>plusDays(start,i));let head=`<div class="toolbar"><button class="iconbtn" data-action="prev">‹</button><span class="label">KW ${isoWeek(start)} · ${fmt(start,{day:'numeric',month:'short'})} – ${fmt(plusDays(start,days-1),{day:'numeric',month:'short'})}</span><button class="iconbtn" data-action="next">›</button><button class="btn small soft" data-action="today">Heute</button></div><div class="toolbar" style="margin-top:10px"><b>${weekType(start)}-Woche</b><button class="btn small soft" data-weektoggle="${weekKey(start)}">A/B wechseln</button>${data.weekTypes[weekKey(start)]?`<button class="btn small" data-weekauto="${weekKey(start)}">Automatisch</button>`:''}</div>`;
let pills=`<div class="day-pills">${dates.map((d,i)=>`<button class="daypick ${i===chosen?'active':''}" data-day="${i}">${DAYS[i]} · ${fmt(d,{day:'numeric'})}</button>`).join('')}</div>`;
let grid=`<div class="week-grid compact" style="--days:${days}"><div class="wh">Zeit</div>${dates.map((d,i)=>`<div class="wh ${i===chosen?'':'other-day'}" data-col="${i}">${DAYFULL[i]}<br>${fmt(d,{day:'numeric',month:'short'})}</div>`).join('')}${Array.from({length:data.settings.hours},(_,h)=>`<div class="hour-label">${timeAt(h)}<br><small>${endAt(h)}</small></div>${dates.map((d,i)=>{let iso=dateISO(d),base=baseSlot(i,h,weekType(d)),occ=occurrence(iso,h),cls=getClass(occ.classId??base.classId),cancel=occ.type==='Entfall';let theme=themeForLesson(occ),icon=[occ.type==='Test'?'📝':occ.type==='Klassenarbeit'?'📄':occ.type==='Vertretung'?'🔁':'',occ.done?'✅':'',occ.homework?'🏠':''].filter(Boolean).join(' ');return `<div class="cell ${i===chosen?'':'other-day'} ${cls&&!cancel?'':'empty-slot'}" data-col="${i}" data-lesson="${iso}|${h}">${cls&&!cancel?`<div class="lesson" style="background:${esc(cls.color)}22;border-color:${esc(cls.color)}"><b>${esc(cls.name)}${occ.room||base.room?' · '+esc(occ.room||base.room):''}</b><span class="topic">${esc(theme?.title||occ.planned||'Stunde planen')}</span><div class="icons">${icon}</div></div>`:cancel?`<div class="lesson" style="background:#eee;border-color:#9a9a9a"><b>Entfall</b><span class="topic">Tippen zum Bearbeiten</span></div>`:`<div class="muted" style="padding:12px 3px">＋ Eintragen</div>`}</div>`}).join('')}`).join('')}</div>`;
return `${title('Planung', 'Wochenplan', 'Tippe auf eine Zelle, um Unterricht zu planen oder zu dokumentieren.',head)}${pills}<section class="card" style="padding:12px">${grid}</section><p class="footer-note">A-/B-Wochentyp folgt dem eingestellten Anker; konkrete Wochen lassen sich oben manuell zuordnen. Stundenänderungen einer Woche werden separat gespeichert.</p>`}
function themeForLesson(occ){if(!occ.themeId)return null;return data.themes.find(t=>t.id===occ.themeId)}
function themeStats(t){let assigned=0,done=0;for(let [date,slots] of Object.entries(data.weeks)){for(let [h,o] of Object.entries(slots||{})){if(o.themeId===t.id){assigned++;if(o.done)done++}}}return {assigned,done}}
function themeLessonPosition(t,date,h){let lessons=[];for(let [lessonDate,slots] of Object.entries(data.weeks)){for(let [lessonHour,o] of Object.entries(slots||{})){if(o?.themeId===t.id&&(lessonDate!==date||+lessonHour!==+h))lessons.push({date:lessonDate,h:+lessonHour})}}lessons.push({date,h:+h});lessons.sort((a,b)=>a.date.localeCompare(b.date)||a.h-b.h);return lessons.findIndex(x=>x.date===date&&x.h===+h)+1}
function classesView(){return `${title('Deine Lerngruppen','Klassen','Themenfortschritt, wichtige Termine und die letzten Unterrichtsnotizen.',`<button class="btn primary" data-action="newclass">＋ Klasse anlegen</button>`)}${data.classes.length?`<div class="grid three">${data.classes.map(c=>{let themes=data.themes.filter(t=>t.classId===c.id),active=themes.find(t=>t.status!=='abgeschlossen')||themes[themes.length-1],st=active?themeStats(active):{assigned:0,done:0},up=allEvents().filter(e=>e.classId===c.id&&e.date>=dateISO(today())).slice(0,2),notes=latestNotes(c.id);return `<article class="card classcard" style="--class:${esc(c.color)}"><div class="section-title"><div><h2>${esc(c.name)}</h2><small class="muted">${esc(c.subject||'Kein Fach')}</small></div><button class="iconbtn" data-editclass="${c.id}" title="Klasse bearbeiten">···</button></div><div class="eyebrow" style="margin-top:20px">Aktuelles Thema</div><b>${esc(active?.title||'Noch kein Thema')}</b>${active?`<div class="progress"><i style="width:${Math.min(100,st.assigned/Math.max(1,active.hours)*100)}%"></i></div><small class="muted">${st.assigned}/${active.hours} Stunden zugeordnet · ${Math.max(0,active.hours-st.assigned)} verbleibend</small>`:''}<div style="margin-top:17px"><b style="font-size:13px">Nächste Termine</b>${up.length?up.map(e=>`<div class="listrow"><span class="event-date">${dateDisplay(e.date)}</span><span>${e.type==='Abgabe'?'📌':e.type==='Klassenarbeit'?'📄':'📝'} ${esc(e.title)}</span></div>`).join(''):`<small class="muted" style="display:block;margin-top:8px">Keine anstehenden Termine</small>`}</div><div style="margin-top:15px"><b style="font-size:13px">Letzte Notizen</b>${notes.length?notes.map(o=>`<small class="muted" style="display:block;margin-top:7px">${dateDisplay(o.date)} · ${esc(o.notes).slice(0,100)}</small>`).join(''):`<small class="muted" style="display:block;margin-top:7px">Noch keine Notizen</small>`}</div><button class="btn small soft" style="margin-top:16px" data-themes="${c.id}">Themen verwalten</button></article>`}).join('')}</div>`:`<section class="card empty">Noch keine Klassen angelegt.<br><button class="btn primary" style="margin-top:14px" data-action="newclass">＋ Erste Klasse anlegen</button></section>`}`}
function latestNotes(classId){let a=[];Object.entries(data.weeks).forEach(([date,slots])=>Object.entries(slots||{}).forEach(([h,o])=>{let cls=getClass(o.classId)||getClass(baseSlot((new Date(date+'T12:00:00').getDay()+6)%7,+h,weekType(new Date(date+'T12:00:00'))).classId);if(cls?.id===classId&&o.notes)a.push({date,notes:o.notes,h:+h})}));return a.sort((x,y)=>y.date.localeCompare(x.date)||y.h-x.h).slice(0,3)}
function allEvents(){let a=[];for(let [date,slots] of Object.entries(data.weeks))for(let [h,o] of Object.entries(slots||{}))if(['Test','Klassenarbeit'].includes(o.type)&&o.title)a.push({date,title:o.title,type:o.type,classId:o.classId||getOccurrenceClass(date,+h),h:+h});for(let t of data.todos)if(t.due&&!t.done)a.push({date:t.due,title:t.title,type:'Abgabe',classId:t.classId});return a.sort((x,y)=>x.date.localeCompare(y.date))}
function getOccurrenceClass(date,h){let day=(new Date(date+'T12:00:00').getDay()+6)%7;return baseSlot(day,h,weekType(new Date(date+'T12:00:00'))).classId}
function eventRow(e){return `<div class="item"><span class="event-date">${dateDisplay(e.date)}</span><span class="dot" style="background:${e.type==='Klassenarbeit'?'#bd714f':'#d8ae61'}"></span><div class="itembody"><b>${e.type==='Klassenarbeit'?'📄':e.type==='Test'?'📝':'📌'} ${esc(e.title)}</b><small>${esc(e.type)}${e.classId&&getClass(e.classId)?' · '+esc(getClass(e.classId).name):''}</small></div></div>`}
function eventsView(){let ev=allEvents(),todos=[...data.todos].sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'));return `${title('Was steht an?','Termine & Aufgaben','Tests, Klassenarbeiten und To-dos an einem Ort.',`<button class="btn primary" data-action="newtodo">＋ To-do</button>`)}<div class="grid two"><section class="card"><div class="section-title"><h2>Termine & Abgaben</h2><small>${ev.length} offen</small></div>${ev.length?ev.map(eventRow).join(''):`<div class="empty">Keine geplanten Termine. Termine entstehen beim Eintragen in einer Stunde.</div>`}</section><section class="card"><div class="section-title"><h2>Allgemeine To-dos</h2></div>${todos.length?todos.map(t=>`<div class="listrow"><input type="checkbox" ${t.done?'checked':''} data-todo="${t.id}" aria-label="${t.done?'Als offen':'Erledigt markieren'}"><div class="grow" style="${t.done?'text-decoration:line-through;opacity:.6':''}"><b>${esc(t.title)}</b><small>${t.due?dateDisplay(t.due):'Ohne Fälligkeit'}${t.classId&&getClass(t.classId)?' · '+esc(getClass(t.classId).name):''}</small></div><button class="iconbtn" data-deltodo="${t.id}" aria-label="Löschen">×</button></div>`).join(''):`<div class="empty">Noch keine Aufgaben eingetragen.</div>`}</section></div>`}
function settingsView(){let s=data.settings;return `${title('Dein Plan, deine Regeln','Einstellungen','Klassen und Zeitraster werden nur in diesem Browser gespeichert.')}<div class="grid two"><section class="card"><div class="section-title"><h2>Unterrichtsraster</h2></div><div class="formrow"><div class="field"><label>Stunden pro Tag</label><input id="hours" type="number" min="1" max="12" value="${s.hours}"></div><div class="field"><label>Schultage</label><select id="days">${[5,6].map(n=>`<option value="${n}" ${s.days===n?'selected':''}>${n===5?'Montag–Freitag':'Montag–Samstag'}</option>`).join('')}</select></div><div class="field"><label>Beginn der 1. Stunde</label><input id="startTime" type="time" value="${s.startTime}"></div><div class="field"><label>Stundenlänge (Min.)</label><input id="lessonMinutes" type="number" min="20" max="120" value="${s.lessonMinutes}"></div><div class="field"><label>Pause zwischen Stunden (Min.)</label><input id="breakMinutes" type="number" min="0" max="60" value="${s.breakMinutes}"></div><div class="field"><label>Schuljahr</label><input id="schoolYear" value="${esc(s.schoolYear)}"></div><div class="field"><label>Startdatum / Anker einer Woche</label><input id="weekStart" type="date" value="${esc(s.weekStart)}"></div><div class="field"><label>Dieser Anker ist</label><select id="weekStartType"><option value="A" ${s.weekStartType!=='B'?'selected':''}>A-Woche</option><option value="B" ${s.weekStartType==='B'?'selected':''}>B-Woche</option></select></div></div><button class="btn primary" data-action="savesettings">Einstellungen speichern</button><p class="footer-note">Stundenbeginn und -ende werden automatisch aus Beginn, Länge und Pause berechnet. Der Wochenplan startet jeweils montags. Der Anker legt den A/B-Rhythmus fest; einzelne Wochen können im Wochenplan manuell überschrieben werden. Vorlagen für A und B werden beim Bearbeiten einer Stunde getrennt gespeichert.</p></section><section class="card"><div class="section-title"><h2>Deine Klassen</h2><button class="btn small soft" data-action="newclass">＋ Hinzufügen</button></div>${data.classes.length?data.classes.map(c=>`<div class="listrow"><span style="width:15px;height:15px;border-radius:5px;background:${esc(c.color)}"></span><div class="grow"><b>${esc(c.name)}</b><small>${esc(c.subject||'Kein Fach')}</small></div><button class="btn small" data-editclass="${c.id}">Bearbeiten</button><button class="iconbtn" data-deleteclass="${c.id}" title="Löschen">×</button></div>`).join(''):`<div class="empty">Lege eine Klasse an, um deinen Plan zu befüllen.</div>`}</section><section class="card backup-card"><div class="section-title"><h2>Daten sichern</h2></div><p class="muted">Erstelle eine JSON-Sicherung oder stelle Daten aus einer früheren Sicherung wieder her.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" data-action="export">JSON exportieren</button><button class="btn" data-action="import">JSON importieren</button><input id="importFile" class="file-input-proxy" type="file" accept=".json,application/json" aria-hidden="true" tabindex="-1"></div><p class="footer-note">Die Daten verlassen dein Gerät nicht. Exportiere regelmäßig eine Sicherung, besonders vor dem Wechsel des Browsers oder Geräts.</p></section><section class="card dangerzone"><div class="section-title"><h2>Alle Daten löschen</h2></div><p class="muted">Entfernt Klassen, Stunden, Themen, Termine und Einstellungen aus diesem Browser.</p><button class="btn danger" data-action="clear">Alle Daten löschen</button></section></div>`}
function render(){document.getElementById('app').innerHTML=shell();let el=document.getElementById('view');el.innerHTML=({today:todayView,week:weekView,classes:classesView,events:eventsView,settings:settingsView}[view]||todayView)();bind()}
function bind(){document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));document.querySelectorAll('[data-weektoggle]').forEach(b=>b.onclick=()=>{let mondayDate=b.dataset.weektoggle,next=weekType(new Date(mondayDate+'T12:00:00'))==='A'?'B':'A';setWeekType(mondayDate,next)});document.querySelectorAll('[data-weekauto]').forEach(b=>b.onclick=()=>{delete data.weekTypes[b.dataset.weekauto];save();render()});document.querySelectorAll('[data-lesson]').forEach(b=>b.onclick=()=>openLesson(...b.dataset.lesson.split('|')));document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{selectedDay=+b.dataset.day;document.querySelector('.week-grid')?.classList.add('compact');document.querySelectorAll('.daypick').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.week-grid [data-col]').forEach(x=>x.classList.toggle('other-day',+x.dataset.col!==selectedDay))});document.querySelectorAll('[data-editclass]').forEach(b=>b.onclick=()=>classModal(b.dataset.editclass));document.querySelectorAll('[data-deleteclass]').forEach(b=>b.onclick=()=>deleteClass(b.dataset.deleteclass));document.querySelectorAll('[data-themes]').forEach(b=>b.onclick=()=>themesModal(b.dataset.themes));document.querySelectorAll('[data-todo]').forEach(b=>b.onclick=()=>toggleTodo(b.dataset.todo));document.querySelectorAll('[data-deltodo]').forEach(b=>b.onclick=()=>{data.todos=data.todos.filter(t=>t.id!==b.dataset.deltodo);save();render()})}
function action(a){if(a==='prev'){weekShift--;render()}if(a==='next'){weekShift++;render()}if(a==='today'){weekShift=0;selectedDay=(today().getDay()+6)%7;render()}if(a==='newclass')classModal();if(a==='newtodo')todoModal();if(a==='export')exportData();if(a==='import')document.getElementById('importFile')?.click();if(a==='clear')clearData();if(a==='savesettings')saveSettings();if(a==='search')searchModal()}
function id(){return Math.random().toString(36).slice(2,10)}
function classModal(classId){let c=classId?getClass(classId):null;showModal(`<div class="modalhead"><div><div class="eyebrow">Lerngruppe</div><h2>${c?'Klasse bearbeiten':'Neue Klasse'}</h2></div><button class="close" data-close>×</button></div><div class="formrow"><div class="field"><label>Name / Kürzel</label><input id="cname" value="${esc(c?.name||'')}" placeholder="z. B. 7a"></div><div class="field"><label>Fach</label><input id="csubject" value="${esc(c?.subject||'')}" placeholder="z. B. Mathematik"></div><div class="field"><label>Farbe</label><input id="ccolor" type="color" value="${esc(c?.color||COLORS[data.classes.length%COLORS.length])}"></div></div><div class="modalfoot"><span></span><div class="right"><button class="btn" data-close>Abbrechen</button><button class="btn primary" id="saveclass">Speichern</button></div></div>`);document.getElementById('saveclass').onclick=()=>{let name=document.getElementById('cname').value.trim();if(!name){flash('Bitte einen Klassennamen eingeben.');return}let v={id:c?.id||id(),name,subject:document.getElementById('csubject').value.trim(),color:document.getElementById('ccolor').value};if(c)Object.assign(c,v);else data.classes.push(v);save();closeModal();render();flash('Klasse gespeichert.')}}
function deleteClass(cid){let c=getClass(cid);if(!c||!confirm(`„${c.name}“ löschen? Die Stundeinträge bleiben bestehen, aber ohne Klassenzuordnung.`))return;data.classes=data.classes.filter(x=>x.id!==cid);save();render()}
function openLesson(date,h){let d=new Date(date+'T12:00:00'),dow=(d.getDay()+6)%7,base=baseSlot(dow,+h,weekType(d)),old=occurrence(date,+h),clsId=old.classId??base.classId,cls=getClass(clsId),themes=data.themes.filter(t=>t.classId===clsId),time=fmt(d,{weekday:'long',day:'numeric',month:'long'});showModal(`<div class="modalhead"><div><div class="eyebrow">${time} · ${timeAt(+h)}–${endAt(+h)}</div><h2>Unterrichtsstunde</h2></div><button class="close" data-close>×</button></div><div class="formrow"><div class="field"><label>Klasse</label><select id="lclass"><option value="">Keine Klasse</option>${data.classes.map(c=>`<option value="${c.id}" ${c.id===clsId?'selected':''}>${esc(c.name)} · ${esc(c.subject)}</option>`).join('')}</select></div><div class="field"><label>Raum</label><input id="lroom" value="${esc(old.room??base.room??'')}" placeholder="z. B. R 204"></div></div><div class="field"><label>Thema / Unterrichtseinheit</label><select id="ltheme"><option value="">Kein Thema</option>${themes.map(t=>`<option value="${t.id}" ${old.themeId===t.id?'selected':''}>${esc(t.title)} · ${themeLessonPosition(t,date,+h)}/${t.hours}</option>`).join('')}</select></div><div class="field"><label>Geplant</label><textarea id="lplanned" placeholder="Was nimmst du dir für diese Stunde vor?">${esc(old.planned||'')}</textarea></div><div class="formrow"><div class="field"><label>Typ</label><select id="ltype">${['normal','Test','Klassenarbeit','Entfall','Vertretung','Exkursion'].map(t=>`<option ${old.type===t?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label>Termin-Titel (für Test / Arbeit)</label><input id="ltitle" value="${esc(old.title||'')}" placeholder="z. B. Bruchrechnung"></div></div><div class="field"><label>Hausaufgaben</label><textarea id="lhomework" placeholder="Aufgabe, Seite …">${esc(old.homework||'')}</textarea></div><div class="field"><label>Durchgeführt / Notizen nach der Stunde</label><textarea id="lnotes" placeholder="Was hat gut funktioniert? Was bleibt offen?">${esc(old.notes||'')}</textarea></div><div class="formrow"><label class="checkline"><input id="ldone" type="checkbox" ${old.done?'checked':''}> Stunde erledigt</label><label class="checkline"><input id="lremind" type="checkbox" ${old.remind?'checked':''}> Erinnerung / To-do merken</label></div><div class="formrow"><label class="checkline"><input id="ltemplate" type="checkbox"> Klasse und Raum in Vorlage übernehmen</label><div class="field"><label>Vorlage bearbeiten</label><select id="ltemplateType"><option value="A" ${weekType(d)==='A'?'selected':''}>A-Woche</option><option value="B" ${weekType(d)==='B'?'selected':''}>B-Woche</option></select></div></div><div class="modalfoot"><button class="btn danger" id="clearlesson">Eintrag leeren</button><div class="right"><button class="btn" data-close>Abbrechen</button><button class="btn primary" id="savelesson">Speichern</button></div></div>`);
let clsSelect=document.getElementById('lclass'),themeSelect=document.getElementById('ltheme');clsSelect.onchange=()=>{let c=getClass(clsSelect.value),th=data.themes.filter(t=>t.classId===c?.id);themeSelect.innerHTML=`<option value="">Kein Thema</option>${th.map(t=>`<option value="${t.id}">${esc(t.title)} · ${themeLessonPosition(t,date,+h)}/${t.hours}</option>`).join('')}`};
function gather(){return {classId:clsSelect.value||'',room:document.getElementById('lroom').value.trim(),themeId:themeSelect.value,planned:document.getElementById('lplanned').value.trim(),type:document.getElementById('ltype').value,title:document.getElementById('ltitle').value.trim(),homework:document.getElementById('lhomework').value.trim(),notes:document.getElementById('lnotes').value.trim(),done:document.getElementById('ldone').checked,remind:document.getElementById('lremind').checked,updateTemplate:document.getElementById('ltemplate').checked}}
 document.getElementById('savelesson').onclick=()=>{let val=gather();if(val.updateTemplate){let target=document.getElementById('ltemplateType').value;let template=target==='B'?data.templateB:data.template;template[slotKey(dow,+h)]={classId:val.classId,room:val.room};delete val.updateTemplate}if(!val.classId&&!val.planned&&!val.notes&&!val.homework&&val.type==='normal'){delete data.weeks[date]?.[h]}else {data.weeks[date]??={};data.weeks[date][h]=val}if(val.remind&&val.planned&&!data.todos.some(t=>t.source===date+'|'+h)){data.todos.push({id:id(),title:val.planned,due:date,classId:val.classId,done:false,source:date+'|'+h})}save();closeModal();render();flash('Stunde gespeichert.')};document.getElementById('clearlesson').onclick=()=>{if(data.weeks[date])delete data.weeks[date][h];save();closeModal();render()}}
function themesModal(cid){
let c=getClass(cid);if(!c)return;
let editingId=null;
let titleInput,hoursInput,startInput,endInput,statusInput,submitButton,cancelButton;
const resetForm=()=>{editingId=null;titleInput.value='';hoursInput.value='6';startInput.value='';endInput.value='';statusInput.value='geplant';submitButton.textContent='＋ Thema hinzufügen';cancelButton.hidden=true};
const renderThemes=()=>{

let th=data.themes.filter(t=>t.classId===cid);
box.innerHTML=th.length?th.map(t=>{let st=themeStats(t);return `<div class="listrow"><div class="grow"><b>${esc(t.title)}</b><small>${st.assigned}/${t.hours} zugeordnet · ${Math.max(0,t.hours-st.assigned)} verbleibend · ${esc(t.status)}${t.start?' · ab '+esc(t.start):''}${t.end?' · bis '+esc(t.end):''}</small><div class="progress"><i style="width:${Math.min(100,st.assigned/Math.max(1,t.hours)*100)}%;background:${esc(c.color)}"></i></div></div><button class="iconbtn" data-thedit="${esc(t.id)}" aria-label="${esc(t.title)} bearbeiten" title="Thema bearbeiten">✎</button><button class="iconbtn" data-thdel="${esc(t.id)}" aria-label="${esc(t.title)} löschen" title="Thema löschen">×</button></div>`}).join(''):`<div class="empty">Noch keine Themen angelegt.</div>`;
box.querySelectorAll('[data-thedit]').forEach(b=>b.onclick=()=>{let t=data.themes.find(x=>x.id===b.dataset.thedit&&x.classId===cid);if(!t)return;editingId=t.id;titleInput.value=t.title||'';hoursInput.value=t.hours||1;startInput.value=t.start||'';endInput.value=t.end||'';statusInput.value=t.status||'geplant';submitButton.textContent='Änderungen speichern';cancelButton.hidden=false;titleInput.focus()});
box.querySelectorAll('[data-thdel]').forEach(b=>b.onclick=()=>{data.themes=data.themes.filter(t=>t.id!==b.dataset.thdel);if(editingId===b.dataset.thdel)resetForm();save();renderThemes()});
};
showModal(`<div class="modalhead"><div><div class="eyebrow">${esc(c.name)} · ${esc(c.subject)}</div><h2>Themen & Einheiten</h2></div><button class="close" data-close>×</button></div><div id="themeList"></div><hr style="border:0;border-top:1px solid var(--line);margin:17px 0"><div class="formrow"><div class="field"><label>Thema / Einheit</label><input id="thtitle" placeholder="z. B. Bruchrechnung"></div><div class="field"><label>Geplante Stunden</label><input id="thhours" type="number" min="1" value="6"></div><div class="field"><label>Beginn der Einheit (optional)</label><input id="thstart" type="date"></div><div class="field"><label>Ende der Einheit (optional)</label><input id="thend" type="date"></div><div class="field"><label>Status</label><select id="thstatus"><option>geplant</option><option>laufend</option><option>abgeschlossen</option></select></div></div><div class="modalfoot"><span></span><div class="right"><button class="btn" data-close>Schließen</button><button class="btn" id="canceltheme" hidden>Abbrechen</button><button class="btn primary" id="addtheme">＋ Thema hinzufügen</button></div></div>`);
titleInput=document.getElementById('thtitle');hoursInput=document.getElementById('thhours');startInput=document.getElementById('thstart');endInput=document.getElementById('thend');statusInput=document.getElementById('thstatus');submitButton=document.getElementById('addtheme');cancelButton=document.getElementById('canceltheme');

}function todoModal(){showModal(`<div class="modalhead"><div><div class="eyebrow">Persönliche Planung</div><h2>Neues To-do</h2></div><button class="close" data-close>×</button></div><div class="field"><label>Aufgabe</label><input id="tdtitle" placeholder="z. B. Arbeitsblätter kopieren"></div><div class="formrow"><div class="field"><label>Fällig am</label><input id="tddue" type="date"></div><div class="field"><label>Klasse (optional)</label><select id="tdclass"><option value="">Keine Klasse</option>${data.classes.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div></div><div class="modalfoot"><span></span><div class="right"><button class="btn" data-close>Abbrechen</button><button class="btn primary" id="savetodo">Aufgabe speichern</button></div></div>`);document.getElementById('savetodo').onclick=()=>{let title=document.getElementById('tdtitle').value.trim();if(!title){flash('Bitte eine Aufgabe eingeben.');return}data.todos.push({id:id(),title,due:document.getElementById('tddue').value,classId:document.getElementById('tdclass').value,done:false});save();closeModal();render()}}
function toggleTodo(tid){let t=data.todos.find(x=>x.id===tid);if(t)t.done=!t.done;save();render()}
function showModal(html){closeModal();let w=document.createElement('div');w.className='modalwrap';w.innerHTML=`<section class="modal" role="dialog" aria-modal="true">${html}</section>`;w.onclick=e=>{if(e.target===w||e.target.closest('[data-close]'))closeModal()};document.body.append(w);document.body.style.overflow='hidden';setTimeout(()=>w.querySelector('input:not([type=checkbox]),select,textarea')?.focus(),50)}function closeModal(){document.querySelector('.modalwrap')?.remove();document.body.style.overflow=''}
function saveSettings(){let s=data.settings;s.hours=Math.max(1,Math.min(12,+document.getElementById('hours').value||6));s.days=+document.getElementById('days').value;s.startTime=document.getElementById('startTime').value||'08:00';s.lessonMinutes=Math.max(20,+document.getElementById('lessonMinutes').value||45);s.breakMinutes=Math.max(0,+document.getElementById('breakMinutes').value||0);s.schoolYear=document.getElementById('schoolYear').value.trim();s.weekStart=document.getElementById('weekStart').value||dateISO(today());s.weekStartType=document.getElementById('weekStartType').value==='B'?'B':'A';save();render();flash('Einstellungen gespeichert.')}
function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`lehrerplaner-sicherung-${dateISO(today())}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);flash('Sicherung exportiert.')}
function importData(file){if(!file)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);let imported=validateImport(x);if(!confirm('Sollen die vorhandenen Lehrerplaner-Daten durch diese Sicherung ersetzt werden?'))return;let previous=data;data=imported;try{save()}catch(e){data=previous;throw e}render();flash('Daten erfolgreich importiert.')}catch(e){flash('Import fehlgeschlagen: '+(e.message||'Unbekannter Fehler'))}};r.onerror=()=>flash('Import fehlgeschlagen: Datei konnte nicht gelesen werden.');try{r.readAsText(file)}catch(e){flash('Import fehlgeschlagen: '+(e.message||'Datei konnte nicht gelesen werden.'))}}
function validateImport(x){const record=v=>v!==null&&typeof v==='object'&&!Array.isArray(v);if(!record(x))throw Error('Die JSON-Wurzel muss ein Objekt sein.');if(!record(x.settings)||!Array.isArray(x.classes)||!record(x.template)||!record(x.weeks)||!Array.isArray(x.todos)||!Array.isArray(x.themes))throw Error('Ungültige Sicherungsstruktur: Einstellungen, Klassen, Vorlage, Wochen, To-dos oder Themen fehlen bzw. haben einen falschen Typ.');let s=x.settings;if(!Number.isFinite(s.hours)||!Number.isFinite(s.days)||!Number.isFinite(s.lessonMinutes)||!Number.isFinite(s.breakMinutes)||typeof s.startTime!=='string'||typeof s.schoolYear!=='string'||typeof s.weekStart!=='string')throw Error('Die Einstellungen sind unvollständig oder ungültig.');if(!x.classes.every(v=>record(v)&&typeof v.id==='string'&&typeof v.name==='string')||!x.todos.every(v=>record(v)&&typeof v.id==='string'&&typeof v.title==='string')||!x.themes.every(v=>record(v)&&typeof v.id==='string'&&typeof v.title==='string'))throw Error('Eintrag in Klassen, To-dos oder Themen ist ungültig.');if(!Object.values(x.template).every(record)||!Object.values(x.templateB||{}).every(record)||!record(x.weekTypes||{})||!Object.values(x.weekTypes||{}).every(v=>v==='A'||v==='B')||!Object.values(x.weeks).every(v=>record(v)&&Object.values(v).every(record)))throw Error('Die Wochen- oder Stundenplandaten haben ein ungültiges Format.');let defaults=initial();return Object.assign(defaults,x,{settings:Object.assign(defaults.settings,x.settings),templateB:x.templateB||{},weekTypes:x.weekTypes||{}})}

function clearData(){if(!confirm('Wirklich alle Lehrerplaner-Daten aus diesem Browser löschen? Dieser Schritt kann nicht rückgängig gemacht werden.'))return;data=initial();save();render();flash('Alle Daten wurden gelöscht.')}
function searchModal(){showModal(`<div class="modalhead"><div><div class="eyebrow">Dein Archiv</div><h2>Notizen durchsuchen</h2></div><button class="close" data-close>×</button></div><input id="noteSearch" class="search" placeholder="Wort oder Thema eingeben …"><div id="searchResults" class="empty">Suchbegriff eingeben.</div>`);let inp=document.getElementById('noteSearch');inp.oninput=()=>{let q=inp.value.trim().toLowerCase(),res=document.getElementById('searchResults');if(!q){res.textContent='Suchbegriff eingeben.';return}let found=[];Object.entries(data.weeks).forEach(([date,slots])=>Object.entries(slots||{}).forEach(([h,o])=>{let text=[o.notes,o.planned,o.homework].join(' ');if(text.toLowerCase().includes(q)){let cls=getClass(o.classId)||getClass(getOccurrenceClass(date,+h));found.push(`<div class="item"><span class="event-date">${dateDisplay(date)}</span><div class="itembody"><b>${esc(cls?.name||'Stunde')} · ${timeAt(+h)}</b><small>${esc(text)}</small></div></div>`)}}));res.innerHTML=found.length?found.join(''):'Keine passenden Notizen gefunden.'}}
// date input import listener delegated
 document.addEventListener('change',e=>{if(e.target.id==='importFile'){let file=e.target.files&&e.target.files[0];if(file)importData(file);e.target.value=''}});
render();
try{if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register(new URL('./sw.js',document.baseURI)).catch(()=>{});}catch(e){}
})();
